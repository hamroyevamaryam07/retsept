{% extends "admin/base_site.html" %}

{% block extrastyle %}
{{ block.super }}
<style>
    /* 1. Asosiy fon va matnlar */
    body {
        background-color: #f8fafc !important;
        font-family: 'Inter', system-ui, -apple-system, sans-serif !important;
    }

    #content {
        padding: 30px 40px !important;
    }

    /* 2. Yuqori Menyu (Header) - To'q Midnight ko'rinishi */
    #header {
        background: #0f172a !important;
        padding: 15px 40px !important;
        border-bottom: 2px solid #1e293b !important;
    }

    #branding h1 {
        color: #ffffff !important;
        font-weight: 700 !important;
        font-size: 1.25rem !important;
    }

    #branding h1 a {
        color: #10b981 !important; /* Emerald Yashil chiroyli nuqta effekti */
    }

    #user-tools {
        color: #94a3b8 !important;
    }

    #user-tools a {
        color: #ffffff !important;
        border-bottom: 1px solid #10b981 !important;
    }

    /* 3. Modullar va Bloklar (Retseptapp, Users) */
    .module {
        background: #ffffff !important;
        border: 1px solid #e2e8f0 !important;
        border-radius: 12px !important;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05) !important;
        margin-bottom: 30px !important;
        overflow: hidden !important;
    }

    .module caption, .inline-group h2 {
        background: #f8fafc !important;
        color: #0f172a !important;
        font-weight: 700 !important;
        font-size: 0.95rem !important;
        border-bottom: 1px solid #e2e8f0 !important;
        padding: 12px 20px !important;
    }

    /* 4. Jadvallar va Qatorlar */
    table thead th {
        background: #f1f5f9 !important;
        color: #475569 !important;
        font-weight: 600 !important;
        text-transform: uppercase !important;
        font-size: 0.75rem !important;
        letter-spacing: 0.05em !important;
        padding: 12px 20px !important;
    }

    form th, form td {
        padding: 15px 20px !important;
        border-bottom: 1px solid #f1f5f9 !important;
    }

    .row1 { background: #ffffff !important; }
    .row2 { background: #fafafa !important; }

    /* 5. Rangli va Zamonaviy Havolalar hamda Tugmalar */
    .model-recipe a.section, .model-user a.section, .model-group a.section {
        font-weight: 600 !important;
        color: #0f172a !important;
        font-size: 0.95rem !important;
    }

    /* Qo'shish (+) tugmasi - Yorqin Zumrad Rangda */
    .addlink {
        color: #10b981 !important;
        font-weight: 600 !important;
        background-color: #ecfdf5 !important;
        padding: 4px 12px !important;
        border-radius: 6px !important;
        border: 1px solid #a7f3d0 !important;
        transition: all 0.2s !important;
    }
    .addlink:hover {
        background-color: #d1fae5 !important;
    }

    /* O'zgartirish (Qalam) tugmasi - Elegant Amber Rangda */
    .changelink {
        color: #d97706 !important;
        font-weight: 600 !important;
        background-color: #fffbeb !important;
        padding: 4px 12px !important;
        border-radius: 6px !important;
        border: 1px solid #fef3c7 !important;
        transition: all 0.2s !important;
    }
    .changelink:hover {
        background-color: #fde68a !important;
    }

    /* 6. O'ng tomondagi "So'nggi harakatlar" paneli */
    #content-related {
        background: #ffffff !important;
        border: 1px solid #e2e8f0 !important;
        border-radius: 12px !important;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05) !important;
        padding: 20px !important;
    }

    #content-related h3 {
        color: #0f172a !important;
        font-weight: 700 !important;
        font-size: 1rem !important;
        margin-bottom: 15px !important;
    }

    ul.actionlist li {
        padding: 8px 0 !important;
        border-bottom: 1px solid #f1f5f9 !important;
    }
</style>
{% endblock %}
