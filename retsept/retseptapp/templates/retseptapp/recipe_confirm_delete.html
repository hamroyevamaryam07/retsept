<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Retseptni o‘chirish</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 500px;">
        <div class="card border-danger shadow">
            <div class="card-body text-center p-4">
                <h4 class="text-danger mb-3">Retseptni o‘chirishni tasdiqlaysizmi?</h4>
                <p>Siz rostdan ham <strong>"{{ retsept.nom }}"</strong> retseptini butunlay o‘chirib tashlamoqchimisiz? Bu amalni ortga qaytarib bo‘lmaydi.</p>
                <form method="POST" class="mt-4">
                    {% csrf_token %}
                    <a href="{% url 'custom_admin_dashboard' %}" class="btn btn-secondary me-2">Yo‘q, bekor qilish</a>
                    <button type="submit" class="btn btn-danger">Ha, o‘chirilsin</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
