<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} — Admin Panel</title>
    <!-- Bootstrap 5 CSS va FontAwesome elementlari -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <link href="https://cloudflare.com" rel="stylesheet">
    
    <!-- ULTRA-MODERN PREMIUM MINIMALIST CSS STYLES -->
    <style>
        :root {
            --bg-page: #f8fafc;
            --surface: #ffffff;
            --text-heading: #0f172a;
            --text-body: #334155;
            --text-muted: #64748b;
            --primary: #0f172a;       /* Qora minimalist rang */
            --accent: #4f46e5;        /* Fokus vaqtida chiroyli ko'k chiziq */
            --border: #e2e8f0;
        }
        
        body {
            background-color: var(--bg-page);
            color: var(--text-body);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            letter-spacing: -0.01em;
        }

        .navbar-custom {
            background-color: #0f172a;
            padding: 0.75rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Yupqa chiziqli zamonaviy karta */
        .card-custom {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05);
        }

        .form-label {
            font-weight: 500;
            color: var(--text-heading);
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }

        /* Majburiy premium kiritish maydonlari (Inputs) */
        .form-group-custom input, 
        .form-group-custom textarea, 
        .form-group-custom select {
            display: block;
            width: 100%;
            padding: 0.65rem 0.85rem;
            font-size: 0.95rem;
            font-weight: 400;
            line-height: 1.5;
            color: var(--text-heading);
            background-color: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.02);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            appearance: none;
        }

        /* Fokus holatidagi o'zgacha nafis ko'k ko'rinish */
        .form-group-custom input:focus, 
        .form-group-custom textarea:focus,
        .form-group-custom select:focus {
            border-color: var(--accent);
            outline: 0;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
            background-color: #fff;
        }

        /* Yordamchi matnlar dizayni */
        .form-text {
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-top: 0.35rem;
        }

        /* Professional quyuq saqlash tugmasi */
        .btn-save {
            background-color: var(--primary);
            color: white;
            font-weight: 500;
            font-size: 0.925rem;
            border-radius: 8px;
            padding: 0.65rem 1.8rem;
            border: 1px solid var(--primary);
            transition: all 0.15s ease;
            text-decoration: none;
        }
        .btn-save:hover {
            background-color: #1e293b;
            border-color: #1e293b;
            color: white;
            transform: translateY(-1px);
        }

        /* Orqaga qaytish oq tugmasi */
        .btn-back {
            border: 1px solid var(--border);
            background: white;
            color: var(--text-body);
            font-weight: 500;
            font-size: 0.925rem;
            border-radius: 8px;
            padding: 0.65rem 1.5rem;
            text-decoration: none;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
        }
        .btn-back:hover {
            background-color: #f8fafc;
            border-color: #cbd5e1;
            color: var(--text-heading);
        }
    </style>
</head>
<body>

    <!-- Yuqori Menyu (Navbar) -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom mb-5">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center fw-bold text-white" href="{% url 'custom_admin_dashboard' %}">
                <i class="fa-solid fa-utensils text-muted me-2"></i> Mazali<span class="text-muted">.</span> Admin
            </a>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-xl-7 col-lg-9 col-md-10 col-12">
                
                <!-- Forma joylashgan oq karta -->
                <div class="card card-custom p-4 p-md-5">
                    <div class="mb-4 border-bottom pb-3">
                        <h2 class="fw-bold h4 text-dark mb-1">{{ title }}</h2>
                        <p class="text-muted small mb-0">Retsept ma'lumotlarini to‘ldiring va saqlash tugmasini bosing.</p>
                    </div>

                    <form method="POST">
                        {% csrf_token %}
                        
                        <!-- Har bir input elementiga premium stil berish logikasi -->
                        {% for field in form %}
                            <div class="mb-4 col-12 form-group-custom">
                                <label class="form-label" for="{{ field.id_for_label }}">
                                    {{ field.label }}
                                </label>
                                {{ field }}
                                {% if field.help_text %}
                                    <div class="form-text">
                                        <i class="fa-regular fa-circle-question me-1"></i> {{ field.help_text }}
                                    </div>
                                {% endif %}
                                {% if field.errors %}
                                    <div class="text-danger small mt-1"><i class="fa-solid fa-circle-exclamation me-1"></i> {{ field.errors }}</div>
                                {% endif %}
                            </div>
                        {% endfor %}

                        <!-- Pastki amallar bloki -->
                        <div class="d-flex justify-content-between align-items-center border-top pt-4 mt-4">
                            <a href="{% url 'custom_admin_dashboard' %}" class="btn-back">
                                <i class="fa-solid fa-arrow-left me-2 small"></i> Orqaga
                            </a>
                            <button type="submit" class="btn-save shadow-sm">
                                Saqlash <i class="fa-solid fa-chevron-right ms-2 small"></i>
                            </button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://jsdelivr.net"></script>
</body>
</html>
